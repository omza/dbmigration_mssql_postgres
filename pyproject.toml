[project]
name = "mssql2pg"
version = "0.2.0"
description = "Migration von MS SQL Server Objekten (gescriptete DDL) und Daten nach PostgreSQL"
readme = "README.md"
authors = [
    { name = "Oliver Meyer", email = "omza@live.de" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "sqlglot>=30.0,<31",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# mssql-python: offizieller MS-Treiber, bringt alles mit (kein System-ODBC nötig)
mssql = ["mssql-python>=1.18"]
# Alternative: pyodbc braucht unixODBC + MS ODBC Driver 18 auf dem Host
pyodbc = ["pyodbc>=5.1"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
mssql2pg = "mssql2pg.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
